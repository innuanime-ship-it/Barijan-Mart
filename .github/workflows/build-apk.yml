name: Build Android APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/splash-screen --legacy-peer-deps

      - name: Create Web Assets (dist)
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://barijan-mart.pages.dev" /></head><body style="background-color:#991B1B;"></body></html>' > dist/index.html

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Generate App Icons & Fullscreen Splash
        run: |
          # 1. Assets prepare karein
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png assets/icon-only.png || true
            cp assets/logo.png assets/icon-foreground.png || true
          fi

          # 2. Capacitor se sabhi sizes ke App Icons generate karein
          npx @capacitor/assets generate --android || true

          # 3. Fullscreen Splash image ko Android drawables mein set karein
          SPLASH_SRC="assets/splash.png"
          if [ ! -f "$SPLASH_SRC" ] && [ -f "assets/logo.png" ]; then
            SPLASH_SRC="assets/logo.png"
          fi

          if [ -f "$SPLASH_SRC" ]; then
            mkdir -p android/app/src/main/res/drawable
            mkdir -p android/app/src/main/res/drawable-port-xxxhdpi
            mkdir -p android/app/src/main/res/drawable-land-xxxhdpi

            cp "$SPLASH_SRC" android/app/src/main/res/drawable/splash.png
            cp "$SPLASH_SRC" android/app/src/main/res/drawable-port-xxxhdpi/splash.png
            cp "$SPLASH_SRC" android/app/src/main/res/drawable-land-xxxhdpi/splash.png
          fi

          # 4. Splash Theme style fix karein
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/values-v31

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#991B1B</item>
                  <item name="colorPrimaryDark">#7F1D1D</item>
                  <item name="colorAccent">#991B1B</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/values-v31/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#991B1B</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash</item>
              </style>
          </resources>
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Fix Duplicate Kotlin Libraries
        run: |
          echo "
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          " >> android/build.gradle

      - name: Build Debug APK & Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Sign Release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore release.keystore \
              -storepass "Barijan@2026" -keypass "Barijan@2026" \
              android/app/build/outputs/bundle/release/app-release.aab barijanmart
            echo "AAB Successfully Signed!"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barijan-Mart-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Barijan-Mart-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          
