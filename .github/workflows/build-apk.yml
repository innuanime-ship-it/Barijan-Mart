name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/splash-screen --legacy-peer-deps

      - name: Create Web Assets (dist)
        run: |
          mkdir -p dist
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=https://barijan-mart.pages.dev" /></head><body></body></html>' > dist/index.html

      - name: Add Android Platform
        run: |
          npx cap add android

      - name: Generate Icon & Splash Screen
        run: |
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png assets/icon-only.png || true
            cp assets/logo.png assets/splash.png || true
            npx @capacitor/assets generate --android || true
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Fix Duplicate Kotlin Libraries
        run: |
          echo "
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          " >> android/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Barijan-Mart-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
